name: Impact Gate Worker

on:
  schedule:
    # Every 15 minutes — matches the FR and Bug worker cadence
    - cron: '*/5 * * * *'
  repository_dispatch:
    types: [issue_status_changed]
  workflow_dispatch:
    inputs:
      issue_id:
        description: 'Paperclip issue UUID (single-issue webhook trigger)'
        required: false
        default: ''
      old_status:
        description: 'Previous issue status (from status-change webhook)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (log results, do not post comments or transition)'
        required: false
        default: 'false'

concurrency:
  group: impact-gate-worker
  cancel-in-progress: true

jobs:
  worker:
    name: Run Impact Gate on in_review fix issues
    runs-on: self-hosted

    # BTCAAAAA-41534: provide a Postgres service so the SCAN target's
    # SQLAlchemy/psycopg2 imports (src/optimizer_v3, src/ai_consultant,
    # src/itm/state) can actually open a connection. Without this, the
    # runner's local 5432 is unbound and the impact-gate worker fails with
    # `(psycopg2.OperationalError) localhost:5432 connection refused`,
    # which the blast-radius monitor then flags as a critical alert.
    # Mirrors the proven services:postgres pattern in .github/workflows/test.yml.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: optimizer_v3
          POSTGRES_USER: optimizer_admin
          POSTGRES_PASSWORD: secure_password_change_me
          # BTCAAAAA-39048 (v3): pg_isready is built on libpq and honors
          # libpq client env vars. Setting PGUSER here means a bare
          # `pg_isready` health-cmd connects as optimizer_admin instead of
          # defaulting to the unix user (root inside the runner container).
          PGUSER: optimizer_admin
        ports:
          # Random host port (no fixed mapping) — multiple self-hosted
          # runners can run this workflow concurrently without "port already
          # allocated" conflicts (BTCAAAAA-38523).
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data:size=512m,mode=1777

    env:
      PAPERCLIP_API_URL: ${{ secrets.PAPERCLIP_API_URL }}
      PAPERCLIP_API_KEY: ${{ secrets.PAPERCLIP_API_KEY }}
      PAPERCLIP_BOARD_API_KEY: ${{ secrets.PAPERCLIP_BOARD_API_KEY }}
      PAPERCLIP_COMPANY_ID: ${{ secrets.PAPERCLIP_COMPANY_ID }}
      PAPERCLIP_RUN_ID: ${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Python
        run: python3 --version

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests python-dotenv SQLAlchemy psycopg2-binary

      - name: Install system dependencies (Qt headless for impact gate tests)
        run: |
          sudo apt-get update || true -qq
          sudo apt-get install -y --no-install-recommends \
            libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xkb1 \
            xvfb libgl1

      - name: Ensure data directory exists
        run: mkdir -p data

      - name: Resolve issue ID and old_status (event payload)
        id: resolve-issue
        run: |
          ISSUE_ID="${{ github.event.inputs.issue_id || '' }}"
          OLD_STATUS="${{ github.event.inputs.old_status || '' }}"
          if [ -z "$ISSUE_ID" ] && [ -n "${{ github.event.client_payload.issue_id || '' }}" ]; then
            ISSUE_ID="${{ github.event.client_payload.issue_id }}"
            OLD_STATUS="${{ github.event.client_payload.old_status || '' }}"
          fi
          echo "issue_id=$ISSUE_ID" >> $GITHUB_OUTPUT
          echo "old_status=$OLD_STATUS" >> $GITHUB_OUTPUT

      - name: Run Impact Gate worker
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
          # BTCAAAAA-41534: Postgres connection env for the SCAN target.
          # These must live on the step (not the job env:) because
          # `job.services.*` only resolves inside a step's env / run block —
          # GitHub Actions rejects `job.services.postgres.ports['5432']` at
          # job scope with HTTP 422 on workflow_dispatch parse.
          POSTGRES_HOST: localhost
          # BTCAAAAA-38523: pick up the dynamic host port that GitHub
          # assigned to the postgres service container.
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
          POSTGRES_DB: optimizer_v3
          POSTGRES_USER: optimizer_admin
          POSTGRES_PASSWORD: secure_password_change_me
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          ISSUE_ID="${{ steps.resolve-issue.outputs.issue_id }}"
          OLD_STATUS="${{ steps.resolve-issue.outputs.old_status }}"
          if [ -n "$ISSUE_ID" ]; then
            python scripts/impact_gate_worker.py --issue-id "$ISSUE_ID" ${OLD_STATUS:+--old-status "$OLD_STATUS"} $FLAGS
          else
            python scripts/run_impact_gate_worker.py $FLAGS
          fi
