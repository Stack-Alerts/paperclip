name: lock-module-verify

on:
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      diff_file:
        description: 'Path to diff file (test fixture)'
        required: false
        default: ''
      changed_files:
        description: 'Comma-separated changed file paths'
        required: false
        default: ''
      touch_index:
        description: 'Use Touch Index DB for test discovery fallback'
        required: false
        default: 'false'
      dry_run:
        description: 'Dry run — report only, do not post comment'
        required: false
        default: 'false'

concurrency:
  group: lock-module-verify-${{ github.ref }}
  cancel-in-progress: true

# BTCAAAAA-38518 (least-privilege): explicit read-only GITHUB_TOKEN. The
# change-detection job only inspects which files changed and never pushes,
# creates artifacts, or interacts with the API beyond checkout. The downstream
# `verify` job is run-only and does not need write scopes either; PR-comment
# posting uses `secrets.GITHUB_TOKEN` explicitly with its own scope.
permissions:
  contents: read

jobs:
  # ─── 0. Change detection ──────────────────────────────────────────────────
  # BTCAAAAA-38518: dorny/paths-filter@v3 (GitHub-hosted action) replaces the
  # BTCAAAAA-37899 self-hosted bash gate. The change-detection job runs on
  # ubuntu-latest so it does NOT consume self-hosted runner minutes — only the
  # `verify` job (which needs the data + db) is self-hosted, and it now skips
  # cleanly when the PR is webui-only. Mirrors BTCAAAAA-37899 / BTCAAAAA-36465
  # — change-detection job instead of a workflow-level `paths:` filter (the
  # filter would dead-lock branch protection by leaving required checks
  # pending).
  changes:
    name: Detect python/server changes
    runs-on: ubuntu-latest
    outputs:
      # `python` is true when any changed file is outside packages/web-ui/.
      # Default step sets it for schedule / workflow_dispatch where the action
      # has no base/ref to diff against — gate must run unconditionally then
      # (operator may have supplied diff_file / changed_files inputs).
      python: ${{ steps.filter.outputs.python || steps.default.outputs.python }}
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0

      - name: Determine whether python/server files changed
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        # Pinned to SHA per BTCAAAAA-38518 supply-chain hardening. SHA
        # corresponds to the v3.0.2 tag; verify against
        # https://github.com/dorny/paths-filter/releases/tag/v3.0.2 on next
        # online session before bumping.
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          # Force git-based diff (no REST API call) so the action works under
          # workflow-level `permissions: contents: read` without requiring
          # `pull-requests: read`. With `fetch-depth: 0` on the prior
          # actions/checkout step, dorny runs `git diff
          # origin/${{ github.base_ref }}...HEAD` to determine changed files.
          # Avoids the "Resource not accessible by integration" 403 we hit on
          # PR #237 when the API path was taken with only contents:read.
          token: ''
          # Match any file outside packages/web-ui/. Two patterns OR'd:
          #   1. '!(packages)/**'         — anything not under packages/
          #   2. 'packages/!(web-ui)/**'  — under packages/ but not web-ui/
          # Together they cover every non-webui path. dorny/paths-filter
          # emits `python=true` if ANY changed file matches any pattern,
          # `python=false` otherwise — same semantics as the previous bash
          # `grep -vq '^packages/web-ui/'` gate.
          filters: |
            python:
              - '!(packages)/**'
              - 'packages/!(web-ui)/**'

      - name: Default python=true when dorny did not produce a value
        id: default
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outcome != 'success' || steps.filter.outputs.python == '')
        run: echo "python=true" >> "$GITHUB_OUTPUT"

  verify:
    name: Lock Module Requirement Verification
    runs-on: self-hosted
    needs: changes
    if: needs.changes.outputs.python == 'true'

    env:
      PAPERCLIP_API_URL: ${{ secrets.PAPERCLIP_API_URL }}
      PAPERCLIP_API_KEY: ${{ secrets.PAPERCLIP_API_KEY }}
      PAPERCLIP_COMPANY_ID: ${{ secrets.PAPERCLIP_COMPANY_ID }}

    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Python
        run: python3 --version

      - name: Install system dependencies (Qt headless)
        run: |
          sudo apt-get update || true -qq
          sudo apt-get install -y --no-install-recommends \
            libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xkb1 \
            xvfb libgl1

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install \
            pytest pytest-cov pytest-qt \
            PyQt5 PyQt5-Qt5 PyQt5-sip \
            SQLAlchemy psycopg2-binary \
            numpy pandas pyarrow \
            pydantic requests python-dotenv

      - name: Run lock module verification
        id: verify
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: |
          FLAGS="--json"
          if [ "${{ github.event.inputs.touch_index }}" = "true" ]; then
            FLAGS="$FLAGS --touch-index"
          fi
          if [ -n "${{ github.event.inputs.diff_file }}" ]; then
            FLAGS="$FLAGS --diff-file ${{ github.event.inputs.diff_file }}"
          elif [ -n "${{ github.event.inputs.changed_files }}" ]; then
            FLAGS="$FLAGS --changed-files ${{ github.event.inputs.changed_files }}"
          fi
          python scripts/lock_module_verify.py $FLAGS > /tmp/verify-output.json 2>&1
          rc=$?
          echo "exit_code=$rc" >> $GITHUB_OUTPUT
          if [ "$rc" -eq 0 ]; then
            echo "gate=passed" >> $GITHUB_OUTPUT
          else
            echo "gate=failed" >> $GITHUB_OUTPUT
          fi
          cat /tmp/verify-output.json

      - name: Generate Markdown report
        id: report
        if: always()
        run: |
          FLAGS="--markdown"
          if [ "${{ github.event.inputs.touch_index }}" = "true" ]; then
            FLAGS="$FLAGS --touch-index"
          fi
          if [ -n "${{ github.event.inputs.diff_file }}" ]; then
            FLAGS="$FLAGS --diff-file ${{ github.event.inputs.diff_file }}"
          elif [ -n "${{ github.event.inputs.changed_files }}" ]; then
            FLAGS="$FLAGS --changed-files ${{ github.event.inputs.changed_files }}"
          fi
          python scripts/lock_module_verify.py $FLAGS > /tmp/verify-report.md 2>/dev/null || true

      - name: Post PR comment
        if: github.event_name == 'pull_request' && github.event.inputs.dry_run != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/verify-report.md', 'utf8');
            const summary = fs.readFileSync('/tmp/verify-output.json', 'utf8');
            let data;
            try { data = JSON.parse(summary); } catch(e) { data = { overall_status: 'ERROR' }; }

            const affectedCount = (data.affected_modules || []).length;
            if (affectedCount === 0) {
              // No locked modules affected — nothing to report
              return;
            }

            const gate = data.overall_status === 'PASS' ? '✅' : '❌';
            const body = `${gate} **Lock Module Verification:** ${data.overall_status}\n\n${report}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Lock Module Verification'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: lock-module-verify-output
          path: |
            /tmp/verify-output.json
            /tmp/verify-report.md
          retention-days: 30

      - name: Write step summary
        if: always()
        run: |
          echo "## Lock Module Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Exit code | ${{ steps.verify.outputs.exit_code }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | ${{ steps.verify.outputs.gate }} |" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/verify-report.md ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            cat /tmp/verify-report.md >> $GITHUB_STEP_SUMMARY
          fi
