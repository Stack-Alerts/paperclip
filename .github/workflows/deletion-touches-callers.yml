name: Deletion-Touches-Callers Gate

# BTCAAAAA-37737 — P-1 pre-merge gate.
# Fails the PR when a public Python def/class is removed while non-test
# callers of the same name still exist in the post-diff tree.
# Background: PR #118 deleted DatabaseManager.scoped_managers() while 9 live
# callers remained in src/api/app.py and CI passed because no test imported
# the symbol directly.

on:
  pull_request:
    branches: ["main", "master"]
    paths:
      - "**/*.py"
      - ".github/workflows/deletion-touches-callers.yml"
      - "scripts/deletion_touches_callers.py"

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: Block deletion of public defs with live callers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0  # need full history to diff against origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Ensure base ref is fetched
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"

      - name: Run deletion-touches-callers gate
        id: gate
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          BASE="origin/$BASE_REF"
          python3 scripts/deletion_touches_callers.py --base-ref "$BASE" --json \
            > /tmp/deletion-callers.json || true
          python3 scripts/deletion_touches_callers.py --base-ref "$BASE" \
            | tee /tmp/deletion-callers.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: deletion-touches-callers-report
          path: |
            /tmp/deletion-callers.txt
            /tmp/deletion-callers.json
          retention-days: 14

      - name: Post failure comment
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let body = '## ❌ Deletion-Touches-Callers Gate Failed\n\n';
            body += 'This PR removes one or more public Python `def`/`class` definitions ';
            body += 'while non-test callers still exist. Restore the symbol, update the ';
            body += 'callers, or include caller removal in the same PR.\n\n';
            body += '<details><summary>Findings</summary>\n\n```\n';
            try {
              body += fs.readFileSync('/tmp/deletion-callers.txt', 'utf8');
            } catch (_) { body += '(report missing)\n'; }
            body += '\n```\n\n</details>\n\nSee BTCAAAAA-37737 for background.';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const prior = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Deletion-Touches-Callers Gate'));
            if (prior) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prior.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
