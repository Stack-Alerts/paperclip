name: Pre-Completion Diff Warning

on:
  schedule:
    # Every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: precompletion-warning
  cancel-in-progress: true

jobs:
  warn:
    name: Warn in_progress issues with uncommitted changes
    runs-on: self-hosted

    env:
      PAPERCLIP_API_URL: ${{ secrets.PAPERCLIP_API_URL }}
      PAPERCLIP_API_KEY: ${{ secrets.PAPERCLIP_API_KEY }}
      PAPERCLIP_COMPANY_ID: ${{ secrets.PAPERCLIP_COMPANY_ID }}

    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0
          clean: false
          token: ${{ github.token }}

      - name: Set up Python
        run: |
          python3 --version
          python3 -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m pip install requests python-dotenv

      - name: Ensure data directory exists
        run: mkdir -p data

      - name: Validate Paperclip credentials
        run: |
          if [ -z "${{ secrets.PAPERCLIP_API_KEY }}" ]; then
            echo "ERROR: PAPERCLIP_API_KEY not set in secrets"
            exit 1
          fi
          if [ -z "${{ secrets.PAPERCLIP_API_URL }}" ]; then
            echo "ERROR: PAPERCLIP_API_URL not set in secrets"
            exit 1
          fi
          echo "Paperclip credentials are configured"

      - name: Run pre-completion diff-check
        id: warn
        env:
          PYTHONPATH: src
        run: |
          python3 scripts/precompletion_diff_check.py > /tmp/precompletion-warning-output.json 2>&1
          echo "warn_exit_code=$?" >> $GITHUB_OUTPUT

      - name: Upload precompletion-warning output artifact
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: precompletion-warning-output
          path: /tmp/precompletion-warning-output.json
          retention-days: 30

      - name: Write step summary
        if: always()
        run: |
          echo "## Pre-Completion Diff Warning" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/precompletion-warning-output.json ]; then
            cat /tmp/precompletion-warning-output.json >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** Routine executed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check routine exit code
        if: steps.warn.outputs.warn_exit_code != '0'
        run: |
          echo "⚠️ Pre-completion diff-check routine failed"
          cat /tmp/precompletion-warning-output.json || echo "No output available"
          exit 1