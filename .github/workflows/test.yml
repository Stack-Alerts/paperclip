name: Test and Coverage

on:
  schedule:
    # Nightly at 04:00 UTC — full test suite with alerting on failure
    - cron: '0 4 * * *'
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  PAPERCLIP_API_URL: ${{ secrets.PAPERCLIP_API_URL }}
  PAPERCLIP_API_KEY: ${{ secrets.PAPERCLIP_API_KEY }}
  PAPERCLIP_COMPANY_ID: ${{ secrets.PAPERCLIP_COMPANY_ID }}

# BTCAAAAA-38518 (least-privilege): explicit read-only GITHUB_TOKEN. The
# change-detection job only inspects which files changed and never pushes,
# creates artifacts, or interacts with the API beyond checkout. The downstream
# pytest / real-data / canary jobs are run-only and do not need write scopes
# either.
permissions:
  contents: read

jobs:
  # ─── 0. Change detection ──────────────────────────────────────────────────
  # BTCAAAAA-38518: dorny/paths-filter@v3 (GitHub-hosted action) replaces the
  # BTCAAAAA-37899 self-hosted bash gate. The change-detection job now runs on
  # ubuntu-latest so it does NOT consume self-hosted runner minutes — the
  # downstream `pytest + coverage gate`, `Real-data regression`, and `Canary
  # trade-execution` stay on self-hosted (they need the data + db) but no
  # longer wait in the same queue behind a gate job. Mirrors BTCAAAAA-37899
  # / BTCAAAAA-36465 — change-detection job instead of a workflow-level
  # `paths:` filter (the filter would dead-lock branch protection by leaving
  # required checks pending).
  changes:
    name: Detect python/server changes
    runs-on: ubuntu-latest
    outputs:
      # `python` is true when any changed file is outside packages/web-ui/.
      # Default step sets it for schedule / workflow_dispatch where the action
      # has no base/ref to diff against — coverage gate must run nightly.
      python: ${{ steps.filter.outputs.python || steps.default.outputs.python }}
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0

      - name: Determine whether python/server files changed
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        # Pinned to SHA per BTCAAAAA-38518 supply-chain hardening. SHA
        # corresponds to the v3.0.2 tag; verify against
        # https://github.com/dorny/paths-filter/releases/tag/v3.0.2 on next
        # online session before bumping.
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          # Force git-based diff (no REST API call) so the action works under
          # workflow-level `permissions: contents: read` without requiring
          # `pull-requests: read`. With `fetch-depth: 0` on the prior
          # actions/checkout step, dorny runs `git diff
          # origin/${{ github.base_ref }}...HEAD` to determine changed files.
          # Avoids the "Resource not accessible by integration" 403 we hit on
          # PR #237 when the API path was taken with only contents:read.
          token: ''
          # Match any file outside packages/web-ui/. Two patterns OR'd:
          #   1. '!(packages)/**'         — anything not under packages/
          #   2. 'packages/!(web-ui)/**'  — under packages/ but not web-ui/
          # Together they cover every non-webui path. dorny/paths-filter
          # emits `python=true` if ANY changed file matches any pattern,
          # `python=false` otherwise — same semantics as the previous bash
          # `grep -vq '^packages/web-ui/'` gate.
          filters: |
            python:
              - '!(packages)/**'
              - 'packages/!(web-ui)/**'

      - name: Default python=true when dorny did not produce a value
        id: default
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outcome != 'success' || steps.filter.outputs.python == '')
        run: echo "python=true" >> "$GITHUB_OUTPUT"

  test:
    name: pytest + coverage gate
    runs-on: self-hosted
    timeout-minutes: 60

    # PostgreSQL service for ITM state store real-database tests (BTCAAAAA-450)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: optimizer_v3
          POSTGRES_USER: optimizer_admin
          POSTGRES_PASSWORD: secure_password_change_me
        ports:
          # Host port 55432 avoids collision with hindsight postgres on
          # the sirrus-local self-hosted runner (BTCAAAAA-30505).
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4.3.1

      - name: Set up Python
        run: python3 --version

      - name: Install system dependencies (Qt headless)
        run: |
          sudo apt-get update || true -qq
          sudo apt-get install -y --no-install-recommends \
            libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xkb1 \
            xvfb libgl1

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install \
            pytest pytest-cov pytest-qt pytest-mock pytest-postgresql pytest-timeout \
            PyQt5 PyQt5-Qt5 PyQt5-sip \
            SQLAlchemy alembic psycopg2-binary \
            numpy pandas pyarrow \
            pydantic requests python-dotenv

      - name: Delete stale .coverage database
        run: rm -f .coverage

      - name: Run tests with coverage gate
        id: tests
        env:
          QT_QPA_PLATFORM: offscreen
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 55432
          POSTGRES_DB: optimizer_v3
          POSTGRES_USER: optimizer_admin
          POSTGRES_PASSWORD: secure_password_change_me
          PYTHONPATH: src
        run: |
          # BTCAAAAA-38144: pytest itself completed in ~35 min and the coverage gate
          # passed at 53.95% on PR #198, but a non-daemon QThread leaked past the
          # main-thread exit and kept the python process alive for ~25 extra minutes
          # (until GitHub's 60-min timeout fired).  `timeout 3000` is a hard 50-min
          # cap on this step so the workflow always lands inside the job's
          # timeout-minutes: 60 budget even if another thread leaks.  --kill-after=60
          # escalates to SIGKILL if pytest ignores SIGTERM.  50 min is intentionally
          # larger than the historic 35-min pytest run so this only fires on a real
          # leak, not on normal slow runs.
          timeout --kill-after=60 3000 \
          python -m pytest \
            tests/test_blast_radius/ \
            tests/test_impact_gate/ \
            tests/test_touch_index/ \
            tests/strategy_builder/validation/ \
            tests/strategy_builder/persistence/ \
            tests/strategy_builder/core/test_signal_dependency_resolver.py \
            tests/strategy_builder/core/test_strategy_config_engine.py \
            tests/strategy_builder/testing/test_walkforward_test_engine.py \
            tests/optimizer_v3/test_error_recovery.py \
            tests/itm/state/ \
            tests/qa/ \
            tests/fr_acceptance/ \
            tests/bug_regression/ \
            --cov=src \
            --cov-config=.coveragerc \
            --cov-report=term-missing \
            --cov-fail-under=20 \
            --timeout=300 \
            -v 2>&1 | tee /tmp/test-output.txt

      - name: Alert on nightly test failure
        if: failure() && github.event_name == 'schedule'
        env:
          PYTHONPATH: src
        run: |
          python scripts/nightly_test_alert.py \
            --workflow "Test and Coverage" \
            --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --test-output /tmp/test-output.txt

  integration-real-data:
    name: Real-data regression (BTCAAAAA-745)
    runs-on: self-hosted
    needs: changes
    if: needs.changes.outputs.python == 'true'

    steps:
      - uses: actions/checkout@v4.3.1

      - name: Set up Python
        run: python3 --version

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install nautilus_trader pandas pyarrow

      - name: Link real data files from host
        run: |
          set -euo pipefail
          mkdir -p data/binance
          linked_count=0
          for month_dir in /home/sirrus/projects/BTC-Trade-Engine-PaperClip/data/binance/*/; do
            [ -d "$month_dir" ] || continue
            month=$(basename "$month_dir")
            mkdir -p "data/binance/$month"
            # BTCAAAAA-37949 (v2): hardcoded ln -sfn + 2>/dev/null silently produced
            # empty per-month dirs whenever the host path did not exist on the
            # runner. The integration test then "found" 0 parquets and the job
            # passed green-with-zero-data instead of failing. Use cp + count + a
            # loud zero-file guard so a missing data mount breaks the build.
            for src in "$month_dir"*.parquet; do
              [ -f "$src" ] || continue
              cp "$src" "data/binance/$month/"
              linked_count=$((linked_count + 1))
            done
          done
          echo "Linked $linked_count parquet files into data/binance/"
          if [ "$linked_count" -eq 0 ]; then
            echo "::error::No parquet files were linked from /home/sirrus/projects/BTC-Trade-Engine-PaperClip/data/binance. Refusing to run against an empty dataset." >&2
            exit 1
          fi

      - name: Run real-data multicore regression test
        run: |
          python -m pytest \
            tests/integration/test_btcaaaaa_745_multicore_real_data_regression.py \
            -v --timeout=300 --override-ini="addopts="

  canary-smoke:
    name: Canary trade-execution (BTCAAAAA-1476)
    runs-on: self-hosted
    needs: changes
    if: needs.changes.outputs.python == 'true'

    steps:
      - uses: actions/checkout@v4.3.1

      - name: Set up Python
        run: python3 --version

      - name: Install system dependencies (Qt headless)
        run: |
          sudo apt-get update || true -qq
          sudo apt-get install -y --no-install-recommends \
            libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xkb1 \
            xvfb libgl1

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install nautilus_trader pandas pyarrow PyQt5 pytest pytest-qt

      - name: Link real data files from host
        run: |
          set -euo pipefail
          mkdir -p data/binance
          linked_count=0
          for month_dir in /home/sirrus/projects/BTC-Trade-Engine-PaperClip/data/binance/*/; do
            [ -d "$month_dir" ] || continue
            month=$(basename "$month_dir")
            mkdir -p "data/binance/$month"
            # BTCAAAAA-37949 (v2): hardcoded ln -sfn + 2>/dev/null silently produced
            # empty per-month dirs whenever the host path did not exist on the
            # runner. The integration test then "found" 0 parquets and the job
            # passed green-with-zero-data instead of failing. Use cp + count + a
            # loud zero-file guard so a missing data mount breaks the build.
            for src in "$month_dir"*.parquet; do
              [ -f "$src" ] || continue
              cp "$src" "data/binance/$month/"
              linked_count=$((linked_count + 1))
            done
          done
          echo "Linked $linked_count parquet files into data/binance/"
          if [ "$linked_count" -eq 0 ]; then
            echo "::error::No parquet files were linked from /home/sirrus/projects/BTC-Trade-Engine-PaperClip/data/binance. Refusing to run against an empty dataset." >&2
            exit 1
          fi

      - name: Run canary smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest \
            tests/bug_regression/test_canary_trade_execution.py \
            -v --tb=short --no-header -q --override-ini="addopts="
