name: Test and Coverage

on:
  schedule:
    # Nightly at 04:00 UTC — full test suite with alerting on failure
    - cron: '0 4 * * *'
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  PAPERCLIP_API_URL: ${{ secrets.PAPERCLIP_API_URL }}
  PAPERCLIP_API_KEY: ${{ secrets.PAPERCLIP_API_KEY }}
  PAPERCLIP_COMPANY_ID: ${{ secrets.PAPERCLIP_COMPANY_ID }}

jobs:
  # ─── 0. Change detection ──────────────────────────────────────────────────
  # BTCAAAAA-37899: skip the BTC-745 / BTC-1476 self-hosted jobs on webui-only
  # PRs. Pattern mirrors ui-ci.yml / BTCAAAAA-36465 — change-detection job
  # instead of a workflow-level `paths:` filter (the filter would dead-lock
  # branch protection by leaving the required checks pending).
  changes:
    name: Detect python/server changes
    runs-on: self-hosted
    outputs:
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0

      - name: Determine whether python/server files changed
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Always run for schedule and manual dispatch — coverage gate must
          # still run nightly regardless of which files changed.
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Event $EVENT_NAME: running python jobs unconditionally"
            echo "python=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Detect changed files for push and pull_request events
          if [ "$EVENT_NAME" = "pull_request" ]; then
            FILES=$(gh pr view "$PR_NUMBER" --json files --jq '.files[].path' || echo "__ERROR__")
          else
            FILES=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" 2>/dev/null || echo "__ERROR__")
          fi
          echo "Changed files:"
          echo "$FILES"
          # python=true when ANY changed file is outside packages/web-ui/.
          # gh pr view returns __ERROR__ if the call fails; fall back to running
          # the tests (fail safe) rather than silently skipping them.
          if echo "$FILES" | grep -q '__ERROR__'; then
            echo "Change detection failed; defaulting python=true (fail safe)."
            echo "python=true" >> "$GITHUB_OUTPUT"
          elif echo "$FILES" | grep -vq '^packages/web-ui/'; then
            echo "python=true (at least one non-webui file changed)" >> "$GITHUB_OUTPUT"
          else
            echo "python=false (webui-only change; skipping BTC-745 / BTC-1476 jobs)" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: pytest + coverage gate
    runs-on: self-hosted
    timeout-minutes: 60

    # PostgreSQL service for ITM state store real-database tests (BTCAAAAA-450)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: optimizer_v3
          POSTGRES_USER: optimizer_admin
          POSTGRES_PASSWORD: secure_password_change_me
        ports:
          # Host port 55432 avoids collision with hindsight postgres on
          # the sirrus-local self-hosted runner (BTCAAAAA-30505).
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4.3.1

      - name: Set up Python
        run: python3 --version

      - name: Install system dependencies (Qt headless)
        run: |
          sudo apt-get update || true -qq
          sudo apt-get install -y --no-install-recommends \
            libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xkb1 \
            xvfb libgl1

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install \
            pytest pytest-cov pytest-qt pytest-mock pytest-postgresql pytest-timeout \
            PyQt5 PyQt5-Qt5 PyQt5-sip \
            SQLAlchemy alembic psycopg2-binary \
            numpy pandas pyarrow \
            pydantic requests python-dotenv

      - name: Delete stale .coverage database
        run: rm -f .coverage

      - name: Run tests with coverage gate
        id: tests
        env:
          QT_QPA_PLATFORM: offscreen
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 55432
          POSTGRES_DB: optimizer_v3
          POSTGRES_USER: optimizer_admin
          POSTGRES_PASSWORD: secure_password_change_me
          PYTHONPATH: src
        run: |
          # BTCAAAAA-38144: pytest itself completed in ~35 min and the coverage gate
          # passed at 53.95% on PR #198, but a non-daemon QThread leaked past the
          # main-thread exit and kept the python process alive for ~25 extra minutes
          # (until GitHub's 60-min timeout fired).  `timeout 3000` is a hard 50-min
          # cap on this step so the workflow always lands inside the job's
          # timeout-minutes: 60 budget even if another thread leaks.  --kill-after=60
          # escalates to SIGKILL if pytest ignores SIGTERM.  50 min is intentionally
          # larger than the historic 35-min pytest run so this only fires on a real
          # leak, not on normal slow runs.
          timeout --kill-after=60 3000 \
          python -m pytest \
            tests/test_blast_radius/ \
            tests/test_impact_gate/ \
            tests/test_touch_index/ \
            tests/strategy_builder/validation/ \
            tests/strategy_builder/persistence/ \
            tests/strategy_builder/core/test_signal_dependency_resolver.py \
            tests/strategy_builder/core/test_strategy_config_engine.py \
            tests/strategy_builder/testing/test_walkforward_test_engine.py \
            tests/optimizer_v3/test_error_recovery.py \
            tests/itm/state/ \
            tests/qa/ \
            tests/fr_acceptance/ \
            tests/bug_regression/ \
            --cov=src \
            --cov-config=.coveragerc \
            --cov-report=term-missing \
            --cov-fail-under=20 \
            --timeout=300 \
            -v 2>&1 | tee /tmp/test-output.txt

      - name: Alert on nightly test failure
        if: failure() && github.event_name == 'schedule'
        env:
          PYTHONPATH: src
        run: |
          python scripts/nightly_test_alert.py \
            --workflow "Test and Coverage" \
            --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --test-output /tmp/test-output.txt

  integration-real-data:
    name: Real-data regression (BTCAAAAA-745)
    runs-on: self-hosted
    needs: changes
    if: needs.changes.outputs.python == 'true'

    steps:
      - uses: actions/checkout@v4.3.1

      - name: Set up Python
        run: python3 --version

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install nautilus_trader pandas pyarrow

      - name: Link real data files from host
        run: |
          set -euo pipefail
          mkdir -p data/binance
          linked_count=0
          for month_dir in /home/sirrus/projects/BTC-Trade-Engine-PaperClip/data/binance/*/; do
            [ -d "$month_dir" ] || continue
            month=$(basename "$month_dir")
            mkdir -p "data/binance/$month"
            # BTCAAAAA-37949: hardcoded ln -sfn + 2>/dev/null silently produced
            # empty per-month dirs whenever the host path did not exist on the
            # runner. The integration test then "found" 0 parquets and the job
            # passed green-with-zero-data instead of failing. Use cp + count + a
            # loud zero-file guard so a missing data mount breaks the build.
            for src in "$month_dir"*.parquet; do
              [ -f "$src" ] || continue
              cp "$src" "data/binance/$month/"
              linked_count=$((linked_count + 1))
            done
          done
          echo "Linked $linked_count parquet files into data/binance/"
          if [ "$linked_count" -eq 0 ]; then
            echo "::error::No parquet files were linked from /home/sirrus/projects/BTC-Trade-Engine-PaperClip/data/binance. Refusing to run against an empty dataset." >&2
            exit 1
          fi

      - name: Run real-data multicore regression test
        run: |
          python -m pytest \
            tests/integration/test_btcaaaaa_745_multicore_real_data_regression.py \
            -v --timeout=300 --override-ini="addopts="

  canary-smoke:
    name: Canary trade-execution (BTCAAAAA-1476)
    runs-on: self-hosted
    needs: changes
    if: needs.changes.outputs.python == 'true'

    steps:
      - uses: actions/checkout@v4.3.1

      - name: Set up Python
        run: python3 --version

      - name: Install system dependencies (Qt headless)
        run: |
          sudo apt-get update || true -qq
          sudo apt-get install -y --no-install-recommends \
            libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xkb1 \
            xvfb libgl1

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install nautilus_trader pandas pyarrow PyQt5 pytest pytest-qt

      - name: Link real data files from host
        run: |
          set -euo pipefail
          mkdir -p data/binance
          linked_count=0
          for month_dir in /home/sirrus/projects/BTC-Trade-Engine-PaperClip/data/binance/*/; do
            [ -d "$month_dir" ] || continue
            month=$(basename "$month_dir")
            mkdir -p "data/binance/$month"
            # BTCAAAAA-37949: hardcoded ln -sfn + 2>/dev/null silently produced
            # empty per-month dirs whenever the host path did not exist on the
            # runner. The integration test then "found" 0 parquets and the job
            # passed green-with-zero-data instead of failing. Use cp + count + a
            # loud zero-file guard so a missing data mount breaks the build.
            for src in "$month_dir"*.parquet; do
              [ -f "$src" ] || continue
              cp "$src" "data/binance/$month/"
              linked_count=$((linked_count + 1))
            done
          done
          echo "Linked $linked_count parquet files into data/binance/"
          if [ "$linked_count" -eq 0 ]; then
            echo "::error::No parquet files were linked from /home/sirrus/projects/BTC-Trade-Engine-PaperClip/data/binance. Refusing to run against an empty dataset." >&2
            exit 1
          fi

      - name: Run canary smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest \
            tests/bug_regression/test_canary_trade_execution.py \
            -v --tb=short --no-header -q --override-ini="addopts="
